# Bootstrap only: use this before obtaining the first TLS certificate.
server {
    listen 80;
    listen [::]:80;
    server_name cardpress.diy www.cardpress.diy;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/cardpress-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 503; }
}
