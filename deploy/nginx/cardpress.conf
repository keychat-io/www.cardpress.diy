# Dedicated CardPress virtual hosts; unrelated sites retain their configuration.
log_format cardpress '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                    '$status $body_bytes_sent "$http_user_agent"';

# Other hostnames on this shared server must not fall through to CardPress TLS.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}

server {
    listen 80;
    listen [::]:80;
    server_name cardpress.diy www.cardpress.diy;
    access_log /var/log/cardpress/access.log cardpress;
    error_log /var/log/cardpress/error.log warn;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/cardpress-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 308 https://www.cardpress.diy$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name cardpress.diy;
    access_log /var/log/cardpress/access.log cardpress;
    error_log /var/log/cardpress/error.log warn;
    ssl_certificate /etc/letsencrypt/live/cardpress.diy/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cardpress.diy/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 308 https://www.cardpress.diy$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.cardpress.diy;
    ssl_certificate /etc/letsencrypt/live/cardpress.diy/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cardpress.diy/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:CardPressTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /var/www/cardpress/current;
    index index.html;
    charset utf-8;
    etag on;
    access_log /var/log/cardpress/access.log cardpress;
    error_log /var/log/cardpress/error.log warn;
    log_not_found off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # Preserve these headers in locations which add Cache-Control.
    add_header_inherit merge;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json application/ld+json application/xml text/xml
               image/svg+xml text/vtt;

    location ~ /\. { deny all; }

    # Astro fingerprints these filenames. Keep old releases for rollback.
    location /_astro/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    # Existing media filenames are stable, so require revalidation after one day.
    location /media/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400, must-revalidate";
    }
    location ~ ^/(robots\.txt|sitemap\.xml|llms\.txt)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=300, must-revalidate";
    }
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }
}
